# DSH Bundle Patch - Registers the video-to-notes plugin
# Applied as a bundle layer when the profile is loaded
- insert:
    - id: video-to-notes
      name: 'video-to-notes'
      config:
        ffmpegPath: ffmpeg
        ffprobePath: ffprobe
        tesseractPath: tesseract
        whisperPath: whisper-cli
        whisperModelDir: ./models
        outputDir: ./notes
        maxConcurrent: 2
        logLevel: info
        configPath: ''