# Registers this plugin in a dsh profile. Applied as a bundle layer.
- insert:
    - id: video-to-notes
      name: 'video-to-notes'
      config:
        ffmpegPath: ffmpeg
        ffprobePath: ffprobe
        tesseractPath: tesseract
        whisperPath: whisper-cli
        whisperModelDir: ./models
        outputDir: ./notes
        maxConcurrent: 2
        logLevel: info
        configPath: ''
