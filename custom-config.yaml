processing:
  frameExtraction:
    preset: lecture
    strategy: adaptive
    sceneThreshold: 0.3
    minIntervalSec: 30
    maxIntervalSec: 5
    intervalSec: 15
    enableTransientDetection: false
    maxFrames: 500
    fastExtract: true
    fastIntervalSec: 20
    enableRegionDetection: false
  ocr:
    psm: auto
    languages:
      - eng
    confidenceThreshold: 0.5
    superResolution: false
    codeDetection: false
    regionAware: false
  transcription:
    model: base.int8
    enableVAD: true
    wordTimestamps: true
    enableEscalation: true
    escalationThreshold: 0.6
    maxEscalations: 1
    enhanceAudio: false
  note:
    template: default
    outputFormats: ['md']
    citationFormat: inline
    detailLevel: comprehensive
  privacy: local-only
  batch:
    maxConcurrent: 2
    checkpointInterval: 1
    resume: true
llm:
  provider: none
  temperature: 0.2
  maxTokens: 2048
  topP: 0.95
